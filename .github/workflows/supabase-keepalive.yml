# Garde le projet Supabase actif : l'offre gratuite met un projet en pause après 7 jours sans activité,
# et le site ne peut alors plus charger les livres. Une petite requête tous les 2 jours suffit.
# Utilise uniquement l'adresse et la clé publique « anon » déjà présentes dans config.js.
name: Supabase keepalive
on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Requête sur la base
        run: |
          URL=$(grep -o "supabaseUrl:'[^']*" config.js | cut -d"'" -f2)
          KEY=$(grep -o "supabaseKey:'[^']*" config.js | cut -d"'" -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 60 "$URL/rest/v1/books?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Réponse : $code"
          test "$code" -lt 500
