<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Petite enquête — livres photo</title>
<meta name="description" content="8 à 12 minutes de questions sur la création de livres photo.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='6' width='24' height='20' rx='4' fill='%23b8584b'/%3E%3Ccircle cx='12' cy='15' r='3' fill='%23fff'/%3E%3Cpath d='M8 23l6-6 4 4 3-3 5 5z' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <div class="who"><span class="avatar" aria-hidden="true">N</span><div><b>Noa</b><small id="status">enquête livres photo</small></div></div>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>
</header>
<main id="chat" aria-live="polite" aria-label="Conversation"></main>
<form id="composer" class="composer" autocomplete="off">
  <button type="button" class="skip" id="skip" hidden>Passer</button>
  <input id="input" type="text" placeholder="Ou réponds avec tes mots…" aria-label="Ta réponse" enterkeyhint="send">
  <button type="submit" class="send" aria-label="Envoyer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg></button>
</form>
<p class="foot">Une courte enquête menée par Gardy. Tes réponses ne servent qu'à ça.</p>
<script src="scenario.js"></script>
<script src="app.js"></script>
</body>
</html>
